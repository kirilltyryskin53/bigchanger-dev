<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог разработчиков — BigChanger Dev</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a class="brand" href="index.html">BigChanger Dev</a>
        <nav class="nav-links">
          <a class="nav-link" href="index.html">Главная</a>
          <a class="nav-link active" href="developers.html">Каталог</a>
          <a class="nav-link" href="submit.html">Добавить профиль</a>
          <a class="nav-link" href="about.html">О проекте</a>
        </nav>
      </div>
    </header>

    <main class="container section">
      <h1>Каталог разработчиков</h1>
      <p class="muted">Ищите по имени, стеку и фильтрам.</p>

      <section class="filters">
        <input id="search" class="input" type="search" placeholder="Поиск: имя, стек, ключевые слова" />
        <select id="countryFilter"><option value="">Страна (все)</option></select>
        <select id="specFilter"><option value="">Специализация (все)</option></select>
        <select id="levelFilter">
          <option value="">Уровень (все)</option>
          <option>Junior</option>
          <option>Middle</option>
          <option>Senior</option>
        </select>
        <select id="formatFilter"><option value="">Формат работы (все)</option></select>
      </section>

      <section id="cards" class="grid cols-3"></section>
    </main>

    <footer class="footer">
      <div class="container">© BigChanger Dev MVP</div>
    </footer>
    <script src="assets/js/developers.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BigChanger Dev Catalog</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container nav">
        <a class="brand" href="index.html" data-i18n="brand">BigChanger Dev</a>
        <nav class="nav-links">
          <a class="nav-link" href="index.html" data-i18n="nav_home">Главная</a>
          <a class="nav-link active" href="developers.html" data-i18n="nav_catalog">Каталог</a>
          <a class="nav-link" href="submit.html" data-i18n="nav_submit">Добавить профиль</a>
          <a class="nav-link" href="about.html" data-i18n="nav_about">О проекте</a>
          <button class="nav-link" data-lang="ru" data-i18n="lang_ru">RU</button>
          <button class="nav-link" data-lang="en" data-i18n="lang_en">EN</button>
        </nav>
      </div>
    </header>

    <main class="container section">
      <h1 data-i18n="catalog_title">Каталог разработчиков</h1>
      <p class="muted" data-i18n="catalog_desc">Ищите по имени, стеку и фильтрам.</p>

      <section class="filters">
        <input id="search" class="input" type="search" data-i18n-placeholder="search_placeholder" placeholder="Поиск: имя, стек, ключевые слова" />
        <select id="countryFilter"><option value="" data-i18n="filter_country_all">Страна (все)</option></select>
        <select id="specFilter"><option value="" data-i18n="filter_spec_all">Специализация (все)</option></select>
        <select id="levelFilter">
          <option value="" data-i18n="filter_level_all">Уровень (все)</option>
          <option>Junior</option>
          <option>Middle</option>
          <option>Senior</option>
        </select>
        <select id="formatFilter"><option value="" data-i18n="filter_work_all">Формат работы (все)</option></select>
      </section>

      <section id="cards" class="grid cols-3"></section>
    </main>

    <footer class="footer">
      <div class="container" data-i18n="footer">© BigChanger Dev MVP</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/i18n.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/catalog.js"></script>
  </body>
</html>
